[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "SpotiFLAC"
version = "4.1.3"
description = "Fetch Spotify track metadata and retrieve matching lossless audio through configurable Tidal, Qobuz & Amazon Music provider backends."
readme = "README.md"
# 3.10, not 3.9: core/models.py declares PEP 604 unions (`str | None`) on
# pydantic BaseModels under `from __future__ import annotations`, and pydantic
# resolves those annotations at runtime — on 3.9 that raises unless the
# optional eval-type-backport package is installed, so `import SpotiFLAC`
# fails outright. 3.10 is also what the classifiers, black, mypy and the CI
# matrix have always targeted; only this line said otherwise.
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    { name=" BartolomeoRusso9, ShuKurenais" }
]

keywords = [
    "spotify", "flac", "downloader", "music", "lossless", "lossless-music",
    "tidal", "qobuz", "amazon-music", "audio", "SpotiFLAC", "spotify-downloader",
    "no-account", "hi-res"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "httpx[http2]>=0.27.0",
    "mutagen>=1.47.0",
    "Pillow>=12.3.0",
    "pydantic>=2.7.0",
    "cryptography>=50.0.0",
    "pycryptodome>=3.20.0",
    "packaging>=23.0",
    "yt-dlp>=2026.7.4",
    "tqdm>=4.66.3",
    "pywebview>=5.0.0",
    # Base, not an extra: --tui is the guided mode, so it cannot be the one
    # that might not be installed. Textual is pure Python (rich, markdown-it-py,
    # platformdirs) and lighter than the pywebview line above it, which pulls
    # native bindings — pyobjc on macOS, GTK/Qt on Linux.
    "textual>=1.0",
    "aiofiles>=23.2.1",
    "tenacity>=8.3.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "pydoll-python>=2.19.0",
    # Base, not an extra: --verify-hires used to be a flag that silently did
    # nothing unless you had also installed SpotiFLAC[hires]. That extra
    # pulled librosa, and with it numba, llvmlite, scipy and scikit-learn —
    # some 346 MB to use six functions. core/hires_check.py now does the
    # analysis on numpy and soundfile directly (verified verdict-for-verdict
    # against the librosa version), which is ~36 MB and no native toolchain,
    # so the check can simply always be available.
    "numpy>=1.24.0",
    "soundfile>=0.12.1",
    # Base, not an extra: webapp.py and webapi/routes.py import FastAPI at
    # module level, so `spotiflac --web` was not a degraded experience
    # without it — it was an ImportError. An entry point that cannot start
    # is not an optional feature.
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    # Base too. It is a thin wrapper, and the weight of acoustic
    # fingerprinting is in `fpcalc` (Chromaprint), a system binary pip could
    # never have installed anyway — so gating the Python half behind an
    # extra only added a second way for the feature to be missing.
    "pyacoustid>=1.3.0"
]

[project.urls]
"Homepage" = "https://github.com/BartolomeoRusso9/SpotiFLAC-Module-Version"
"Repository" = "https://github.com/BartolomeoRusso9/SpotiFLAC-Module-Version"
"Bug Tracker" = "https://github.com/BartolomeoRusso9/SpotiFLAC-Module-Version/issues"

[project.scripts]
spotiflac = "SpotiFLAC.launcher:main"

[tool.setuptools]
packages = { find = { include = ["SpotiFLAC*"] } }
include-package-data = true

[tool.setuptools.package-data]
# py.typed is the PEP 561 marker: without it type checkers ignore every
# annotation in this package for anyone who installs it, which for a library
# meant to be imported into other projects is most of the value of having
# written them.
"SpotiFLAC" = [
    "py.typed",
    "extensions/*.js",
    "extensions/**/*.js",
    "frontend/*",
    "frontend/assets/icons/*",
    # Textual reads the TUI's stylesheet from disk at startup (CSS_PATH), so
    # an install without it opens on an unstyled screen rather than failing
    # loudly — worth listing here explicitly.
    "tui/*.tcss",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-httpx>=0.21",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.12.0",
    "black>=26.3.1",
    "mypy>=1.10",
    "pre-commit>=3.0",
]
# `web`, `hires` and `dedup` used to live here. Everything they installed is
# part of the base install now, and pip treats a request for an extra that no
# longer exists as a warning rather than an error, so an old
# `pip install 'SpotiFLAC[web]'` still gets a working install.

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Pin the rule set explicitly. With no `select`, Ruff applies whatever its
# current default is — and Ruff 0.16 (Aug 2026) expanded that default, which
# turned CI red (500+ findings: BLE001, RUF012, S110, N999, …) with zero code
# changes. This is the historical default set; broaden it deliberately later
# and fix findings in batches rather than having a release do it for us.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Imports deliberately placed after module-level setup code (see the
# comments at each site): a circular-import guard in core/__init__.py,
# a warnings.filterwarnings() call that must run before the import it's
# silencing in tools/hires_check_cli.py, and a pytest.importorskip()
# guard that must run before `from SpotiFLAC import launcher` in the
# web-flags test (an inline `# noqa` there gets stripped by the release
# workflow's `ruff check --fix`).
"SpotiFLAC/core/__init__.py" = ["E402"]
"SpotiFLAC/tools/hires_check_cli.py" = ["E402"]
"tests/test_launcher_web_flags.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Baseline as of 2026-08: ~177 pre-existing errors across the codebase (most
# of it predates type checking entirely). Kept intentionally lenient and
# run as advisory-only in CI (see .github/workflows/ci.yml) rather than
# blocking, so it can be tightened module-by-module over time instead of
# requiring one large cleanup pass up front.
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false
warn_redundant_casts = true
exclude = ["build/", "dist/"]

[[tool.mypy.overrides]]
# The audio-analysis deps, used only by core/hires_check.py. They are part of
# the base install now (librosa, which needed this override to avoid aborting
# the run on PEP 695 syntax, is gone), but their source is still skipped
# rather than followed: numpy's stubs pull a large graph into an advisory-only
# run, and every finding here would be in numpy rather than in this codebase.
module = ["numpy.*", "soundfile.*"]
follow_imports = "skip"

[tool.coverage.run]
source = ["SpotiFLAC"]
omit = [
    "SpotiFLAC/frontend/*",
    "*/__pycache__/*",
]
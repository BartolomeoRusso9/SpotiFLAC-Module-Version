[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "SpotiFLAC"
version = "3.1.1"
description = "Fetch Spotify track metadata and retrieve matching lossless audio through configurable Tidal, Qobuz & Amazon Music provider backends."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    { name=" BartolomeoRusso9, ShuKurenais" }
]

keywords = [
    "spotify", "flac", "downloader", "music", "lossless", "lossless-music",
    "tidal", "qobuz", "amazon-music", "audio", "SpotiFLAC", "spotify-downloader",
    "no-account", "hi-res"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "httpx[http2]>=0.27.0",
    "mutagen>=1.47.0",
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",
    "pycryptodome>=3.20.0",
    "packaging>=23.0",
    "yt-dlp>=2024.04.09",
    "tqdm>=4.66.0",
    "pywebview>=5.0.0",
    "aiofiles>=23.2.1",
    "tenacity>=8.3.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pydoll-python>=2.9.0"
]

[project.urls]
"Homepage" = "https://github.com/BartolomeoRusso9/SpotiFLAC-Module-Version"
"Repository" = "https://github.com/BartolomeoRusso9/SpotiFLAC-Module-Version"
"Bug Tracker" = "https://github.com/BartolomeoRusso9/SpotiFLAC-Module-Version/issues"

[project.scripts]
spotiflac = "SpotiFLAC.launcher:main"

[tool.setuptools]
packages = { find = { include = ["SpotiFLAC*"] } }
include-package-data = true

[tool.setuptools.package-data]
"SpotiFLAC" = ["extensions/*.js", "extensions/**/*.js"]

[tool.setuptools.data-files]
"frontend" = [
    "frontend/*",
    "frontend/assets/*",
    "frontend/assets/icons/*",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-httpx>=0.21",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.12.0",
    "black>=24.0",
    "mypy>=1.10",
    "pre-commit>=3.0",
]
hires = [
    "librosa>=0.10.0",
    "numpy>=1.24.0",
]
dedup = [
    "pyacoustid>=1.3.0",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88

[tool.ruff.lint.per-file-ignores]
# Imports deliberately placed after module-level setup code (see the
# comments at each site): a circular-import guard in core/__init__.py,
# and a warnings.filterwarnings() call that must run before the import
# it's silencing in tools/hires_check_cli.py.
"SpotiFLAC/core/__init__.py" = ["E402"]
"SpotiFLAC/tools/hires_check_cli.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Baseline as of 2026-08: ~177 pre-existing errors across the codebase (most
# of it predates type checking entirely). Kept intentionally lenient and
# run as advisory-only in CI (see .github/workflows/ci.yml) rather than
# blocking, so it can be tightened module-by-module over time instead of
# requiring one large cleanup pass up front.
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false
warn_redundant_casts = true
exclude = ["build/", "dist/"]

[[tool.mypy.overrides]]
# Optional heavy deps (the `hires` extra) pulled in only by core/hires_check.py.
# Not installed in CI's default dev environment. When present locally, skip
# reading their source entirely (treated as untyped `Any`) instead of just
# suppressing errors: librosa's own source uses PEP 695 syntax mypy's parser
# can't even read under python_version=3.10, which aborts the whole run
# rather than reporting a normal per-module error.
module = ["librosa.*", "numpy.*"]
follow_imports = "skip"

[tool.coverage.run]
source = ["SpotiFLAC"]
omit = [
    "SpotiFLAC/frontend/*",
    "*/__pycache__/*",
]
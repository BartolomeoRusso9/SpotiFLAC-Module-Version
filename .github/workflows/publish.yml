name: Publish to PyPI

# Releases are cut from a tag, never from a branch. The previous trigger was
# `push: branches: [main]`, which meant every merge attempted an upload: it
# succeeded whenever the version had been bumped (publishing whatever main
# happened to contain at that moment, tested or not) and failed with "file
# already exists" the rest of the time — so a red run stopped meaning
# anything. Tags make publishing an explicit act.
on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Publishing is irreversible: PyPI does not allow re-uploading a version,
  # even after a delete. So the suite runs here rather than relying on the
  # separate CI workflow — GitHub cannot express `needs:` across workflows,
  # and a tag can be pushed to a commit CI never ran on.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[web]'
          pip install -r requirements-dev.txt

      - name: Pytest
        run: pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      # Lets GitHub mint the short-lived OIDC token that PyPI exchanges for a
      # ~15-minute, project-scoped upload token. This is the whole credential:
      # there is no PyPI secret in this repository any more.
      #
      # The trusted publisher registered on PyPI pins owner + repo + this
      # filename + this environment, so renaming publish.yml or dropping the
      # `environment:` line above breaks publishing until PyPI is updated to
      # match. Another workflow in this repo cannot publish at all.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Check the tag matches the version in pyproject.toml
        # Catches the tag/version mismatch that used to surface only as an
        # opaque "file already exists" from PyPI, after the build had run.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $VERSION"
            exit 1
          fi
          echo "Tag and pyproject version agree: $VERSION"

      - name: Build package
        run: python -m build

      - name: Validate distribution artifacts
        run: python -m twine check dist/*

      - name: Publish package to PyPI
        # No `password:` — authentication is Trusted Publishing (OIDC), via
        # the `id-token: write` permission on this job. The action detects the
        # OIDC token itself and exchanges it with PyPI.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Absorbs the one duplicate this workflow's two triggers can produce:
          # push a v* tag (build-release.yml does) and it publishes, then cut a
          # GitHub Release from that same tag and `release: published` fires a
          # second run for a version PyPI already has. Without this, that second
          # run goes red for no real reason — the exact "a failed publish stops
          # meaning anything" problem this workflow was rewritten to avoid.
          #
          # It does NOT hide a forgotten version bump: the tag/version check
          # above fails loudly for that, before anything is even built.
          skip-existing: true

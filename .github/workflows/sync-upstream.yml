name: Sync with upstream

on:
  schedule:
    # Daily at 04:17 UTC (off the hour to avoid GitHub's cron rush)
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/BartolomeoRusso9/SpotiFLAC-Module-Version.git
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: git fetch --no-tags "$UPSTREAM_REPO" "$UPSTREAM_BRANCH"

      - name: Merge upstream
        run: |
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi
          # Fails on conflict, which is intentional: the run turns red and
          # the merge is resolved manually.
          git merge --no-edit FETCH_HEAD

      - name: Push
        run: git push origin "HEAD:$TARGET_BRANCH"

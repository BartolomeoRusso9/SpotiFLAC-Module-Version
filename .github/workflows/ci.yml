name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # .[web] rather than plain `.` — the webapp/launcher tests start
          # with pytest.importorskip("fastapi"), so without the extra they
          # were being silently skipped here (5 files' worth) while passing
          # locally, which is the worst of both worlds.
          pip install -e '.[web]'
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: Mypy (advisory — see [tool.mypy] in pyproject.toml)
        # Not blocking yet: the codebase predates type checking and carries a
        # sizeable pre-existing error backlog. Surfaced in the log so it's
        # visible and can be tightened incrementally, without turning every
        # unrelated PR red today.
        run: mypy SpotiFLAC || true

      - name: Pytest (with coverage)
        run: pytest -v --cov=SpotiFLAC --cov-report=term-missing --cov-fail-under=26

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS syntax check (frontend)
        # Syntax only — this project has no JS test framework/runner set up,
        # so this just catches a broken frontend/*.js file (parse error)
        # before it ships, the cheapest possible net for a codebase with no
        # other JS coverage at all.
        run: |
          for f in SpotiFLAC/frontend/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

  test-windows:
    # A pywebview desktop app lives or dies on Windows; the matrix above only
    # ever ran on Linux. This doesn't repeat lint/format/mypy — just the test
    # suite, to catch path-separator/encoding/subprocess issues Linux CI can't.
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # .[web] rather than plain `.` — the webapp/launcher tests start
          # with pytest.importorskip("fastapi"), so without the extra they
          # were being silently skipped here (5 files' worth) while passing
          # locally, which is the worst of both worlds.
          pip install -e '.[web]'
          pip install -r requirements-dev.txt

      - name: Pytest
        run: pytest -v

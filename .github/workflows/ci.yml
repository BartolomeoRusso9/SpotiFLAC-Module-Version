name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Plain `.` now installs FastAPI too: the webapp/launcher tests
          # start with pytest.importorskip("fastapi"), and they were once
          # silently skipped here (5 files' worth) while passing locally.
          # The `[web]` extra that fixed that no longer exists — everything
          # it held is a base dependency.
          pip install -e .
          pip install -r requirements-dev.txt
          pip install build

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: Mypy (advisory — see [tool.mypy] in pyproject.toml)
        # Not blocking yet: the codebase predates type checking and carries a
        # sizeable pre-existing error backlog. Surfaced in the log so it's
        # visible and can be tightened incrementally, without turning every
        # unrelated PR red today.
        run: mypy SpotiFLAC || true

      - name: Pytest (with coverage)
        run: pytest -v --cov=SpotiFLAC --cov-report=term-missing --cov-fail-under=30

      - name: Architecture guards
        run: >-
          pytest -q tests/test_architecture_foundation.py
          tests/test_webapi_v1.py tests/test_webapp_isolation.py

      - name: Package build
        run: python -m build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS syntax check (frontend)
        # Syntax only — this project has no JS test framework/runner set up,
        # so this just catches a broken frontend/*.js file (parse error)
        # before it ships, the cheapest possible net for a codebase with no
        # other JS coverage at all.
        run: |
          for f in SpotiFLAC/frontend/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

  test-windows:
    # A pywebview desktop app lives or dies on Windows; the matrix above only
    # ever ran on Linux. This doesn't repeat lint/format/mypy — just the test
    # suite, to catch path-separator/encoding/subprocess issues Linux CI can't.
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Plain `.` now installs FastAPI too: the webapp/launcher tests
          # start with pytest.importorskip("fastapi"), and they were once
          # silently skipped here (5 files' worth) while passing locally.
          # The `[web]` extra that fixed that no longer exists — everything
          # it held is a base dependency.
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Pytest
        run: pytest -v

  docker:
    name: Docker build and health check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: spotiflac:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start web container
        run: |
          docker run -d --name spotiflac-ci -p 8000:8000 \
            spotiflac:ci --web --host 0.0.0.0 --port 8000

      - name: Check health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker logs spotiflac-ci
          exit 1

      - name: Stop container cleanly
        if: always()
        run: |
          docker stop --time 15 spotiflac-ci
          test "$(docker inspect --format '{{.State.ExitCode}}' spotiflac-ci)" = 143
